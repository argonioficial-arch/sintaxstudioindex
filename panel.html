<style>
:root{--bg:#101116;--bg2:#171922;--bg3:#1d202b;--line:#262a37;--blue:#76a8ff;--ink:#fff;--mut:#9aa3b8;--ok:#6fd3a6;--warn:#f3c98b;--bad:#ff8a8a;--r:22px;
--d:"Bricolage Grotesque","Trebuchet MS",sans-serif;--b:"DM Sans",system-ui,sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--b);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--d);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:0}
h1{font-size:clamp(28px,4vw,42px)}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.sub{color:var(--mut)}
.hide{display:none!important}

/* botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:var(--bg);font:500 15px var(--b);padding:12px 22px;border-radius:99px;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px -8px rgba(118,168,255,.55)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.o{background:none;color:var(--ink);border-color:var(--line)}.btn.o:hover{border-color:var(--blue);box-shadow:none}
.btn.d{background:none;color:var(--bad);border-color:rgba(255,138,138,.35)}.btn.d:hover{border-color:var(--bad);box-shadow:none}
.btn.s{padding:7px 16px;font-size:14px}
label{display:grid;gap:6px;font-size:14px;color:var(--mut)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--blue);outline:none}
textarea{min-height:110px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--blue);cursor:pointer}
input[type=date]{color-scheme:dark}
form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* pantallas de acceso */
.center{min-height:100svh;display:grid;place-items:center;padding:24px}
.auth{width:min(430px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:28px;padding:38px 34px;box-shadow:0 40px 80px -40px rgba(118,168,255,.25)}
.auth img.lg{height:34px;display:block;margin-bottom:28px}
.auth h1{font-size:30px;margin-bottom:8px}
.auth .sub{margin-bottom:24px;font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px;margin-bottom:24px}
.tabs button{background:none;border:0;border-radius:99px;padding:9px;cursor:pointer;color:var(--mut);font-weight:500}
.tabs button[aria-selected=true]{background:var(--bg3);color:var(--ink)}
.lnk{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-size:14px;text-align:left}
.lnk:hover{text-decoration:underline}
.msg{font-size:14px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.msg.err{color:var(--bad);border-color:rgba(255,138,138,.35)}
.msg.ok{color:var(--ok);border-color:rgba(111,211,166,.35)}
.setup{width:min(640px,100%)}
.setup code,.sub code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--blue)}
.setup ol{padding-left:20px;color:var(--mut);display:grid;gap:10px}

/* layout del panel */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100svh}
.side{position:sticky;top:0;height:100svh;background:var(--bg2);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:26px;z-index:30}
.side img.lg{height:28px;display:block;margin:2px 10px 0;align-self:flex-start}
.side nav{display:grid;gap:4px}
.side nav a{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:14px;color:var(--mut);font-weight:500;transition:background .2s,color .2s}
.side nav a:hover{color:var(--ink);background:var(--bg3)}
.side nav a[aria-current=page]{background:rgba(118,168,255,.12);color:var(--blue)}
.badge{background:var(--blue);color:var(--bg);font-size:12px;font-weight:700;border-radius:99px;padding:0 8px;min-width:22px;text-align:center}
.me{margin-top:auto;display:grid;gap:10px}
.who{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;transition:border-color .2s}
.who:hover{border-color:var(--blue)}
.who b{display:block;font-weight:500;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mut);font-size:12px}
.who>span:last-child{min-width:0}
.top{display:none}
main{padding:44px clamp(20px,4vw,56px) 80px;min-width:0;max-width:1400px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.ph .sub{margin-top:10px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* avatares y chips */
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h) 62% 72%);color:#101116;font:800 11px var(--d);flex:none;letter-spacing:0}
.av.lg{width:38px;height:38px;font-size:14px}
.avs{display:flex}.avs .av{margin-left:-8px;border:2px solid var(--bg2)}.avs .av:first-child{margin-left:0}
.chip{display:inline-block;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 12px;color:var(--mut);white-space:nowrap}
.st-en_curso{color:var(--blue);border-color:rgba(118,168,255,.4)}
.st-completado,.st-hecha{color:var(--ok);border-color:rgba(111,211,166,.4)}
.st-en_pausa,.st-revision{color:var(--warn);border-color:rgba(243,201,139,.4)}
.pr{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.pr.media{background:var(--warn)}.pr.alta{background:var(--bad)}
.due{font-size:12.5px;color:var(--mut)}.due.late{color:var(--bad)}
.empty{color:var(--mut);padding:22px 4px;font-size:15px}

/* resumen */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.stat b{display:block;font:800 42px/1 var(--d);letter-spacing:-.04em;margin-bottom:8px}
.stat span{color:var(--mut);font-size:14px}.stat.bad b{color:var(--bad)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.box h2{margin-bottom:14px}

/* filas de tareas */
.tr{display:flex;align-items:center;gap:14px;padding:13px 6px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.tr:first-of-type{border-top:0}
.tr:hover{background:rgba(118,168,255,.05)}
.tr .tt{flex:1;min-width:0}
.tr .tt b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .tt small{color:var(--mut)}
.tr.done .tt b{text-decoration:line-through;color:var(--mut)}
.tr .meta{display:flex;align-items:center;gap:12px}

/* proyectos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pc{display:flex;flex-direction:column;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:border-color .3s,transform .3s}
.pc:hover{border-color:var(--blue);transform:translateY(-4px)}
.pc h3{font-size:22px}
.pc p{color:var(--mut);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:10px}
.bar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .5s}
.pb{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:6px}
.back{color:var(--mut);font-size:14px;display:inline-block;margin-bottom:14px}.back:hover{color:var(--ink)}
.pd{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.desc{color:var(--mut);max-width:70ch;margin-top:14px;white-space:pre-wrap}
.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.filters select{width:auto}
.filters label.ck{display:flex;align-items:center;gap:8px;color:var(--ink)}

/* tablero */
.kb{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:10px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;min-height:140px;transition:border-color .2s,background .2s}
.col.ov{border-color:var(--blue);background:rgba(118,168,255,.06)}
.col>h3{display:flex;justify-content:space-between;padding:2px 6px 14px;font-size:15px}
.col>h3 span{color:var(--mut);font-family:var(--b);font-weight:400}
.cl{display:grid;gap:10px}
.tk{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:border-color .2s,transform .2s}
.tk:hover{border-color:var(--blue)}
.tk.drag{opacity:.4}
.tk .tt{font-weight:500;margin-bottom:10px;overflow-wrap:anywhere}
.tk .tm{display:flex;align-items:center;gap:10px;min-height:28px}
.tk .tm .av{margin-left:auto}

/* equipo */
.tbl{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:16px 22px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font:800 12px var(--d);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
td select{width:auto;padding:8px 34px 8px 12px}
.pn{display:flex;align-items:center;gap:12px}.pn small{color:var(--mut);display:block}

/* diálogos */
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:0;width:min(640px,100% - 24px);max-height:90vh;overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(5,6,9,.72);backdrop-filter:blur(4px)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.mf{display:flex;flex-direction:column;min-height:0;gap:0}
.dh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--line)}
.dh h2{font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--mut);flex:none}
.x:hover{color:var(--ink);border-color:var(--blue)}
.db{padding:24px 28px;overflow-y:auto;display:grid;gap:16px;align-content:start}
.df{display:flex;justify-content:flex-end;gap:10px;padding:16px 28px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .sp{margin-right:auto}
.ml{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ml li{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.ml li span:nth-child(2){flex:1}
.addm{display:flex;gap:10px}
.cm{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.cm h3{font-size:16px}
.cmi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cmi header{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:4px}
.cmi header b{color:var(--ink);font-weight:500}
.cmi header .x{margin-left:auto;width:24px;height:24px;font-size:12px}
.cmi p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.cmn{display:flex;gap:10px}

/* avisos */
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:100;max-width:min(380px,100% - 40px)}
.toast{background:var(--bg2);border:1px solid var(--blue);border-radius:16px;padding:14px 18px;box-shadow:0 20px 50px -10px #000;font-size:14.5px;animation:pop .3s}
.toast.err{border-color:var(--bad)}

@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);transform:translateX(-100%);transition:transform .3s}
  body.mo .side{transform:none;box-shadow:0 0 0 100vmax rgba(5,6,9,.6)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(16,17,22,.85);backdrop-filter:blur(12px);z-index:20}
  .top img{height:24px}
  .top .x{border-radius:12px;width:40px;height:40px;font-size:18px}
  main{padding-top:30px}
  .kb{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .auth{padding:30px 24px}
}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:12px}.stat{padding:18px}.stat b{font-size:34px}.dh,.db,.df{padding-left:20px;padding-right:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<noscript><div class="center"><div class="auth"><h1>Necesitas JavaScript</h1><p class="sub">El panel no funciona sin JavaScript activado.</p></div></div></noscript>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ===================================================================
   CONFIGURACIÓN: pega aquí los datos de tu proyecto de Supabase

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PSTATUS = {planificado:'Planificado', en_curso:'En curso', en_pausa:'En pausa', completado:'Completado'};
const TSTATUS = {pendiente:'Pendiente', en_curso:'En curso', revision:'En revisión', hecha:'Hecha'};
const PRIO = {baja:'Baja', media:'Media', alta:'Alta'};
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = s => { if (!s) return ''; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString('es-ES', {day:'numeric', month:'short'}); };
const fmtTime = s => new Date(s).toLocaleString('es-ES', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const opts = (obj, sel) => Object.entries(obj).map(([k,v]) => `<option value="${k}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');
const hue = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const ini = n => n.trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase() || '?';

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 6000 : 3500);
}
function errMsg(e) {
  if (!e) return 'Error desconocido';
  if (e.code === '42501' || /row-level security/i.test(e.message || '')) return 'No tienes permiso para hacer esto.';
  if (/Invalid login credentials/i.test(e.message || '')) return 'Email o contraseña incorrectos.';
  if (/Email not confirmed/i.test(e.message || '')) return 'Confirma tu email antes de entrar (revisa tu bandeja).';
  if (/already registered/i.test(e.message || '')) return 'Ya existe una cuenta con ese email.';
  if (/Password should be/i.test(e.message || '')) return 'La contraseña debe tener al menos 6 caracteres.';
  return e.message || String(e);
}

const isAdmin = () => S.me?.role === 'admin';
const prof = id => S.profiles.find(p => p.id === id);
const nameOf = id => { const p = prof(id); return p ? (p.full_name || p.email) : 'Sin asignar'; };
const projOf = id => S.projects.find(p => p.id === id);
const canManageProject = p => !!p && (isAdmin() || p.created_by === S.user.id);
const canDeleteTask = t => isAdmin() || t.created_by === S.user.id || projOf(t.project_id)?.created_by === S.user.id;
const isOverdue = t => !!t.due_date && t.status !== 'hecha' && t.due_date < todayStr();
const byDue = (a, b) => (a.due_date || '9999') < (b.due_date || '9999') ? -1 : (a.due_date || '9999') > (b.due_date || '9999') ? 1 : 0;
const tasksOf = pid => S.tasks.filter(t => t.project_id === pid);
const membersOf = pid => S.members.filter(m => m.project_id === pid).map(m => m.user_id);
const avatar = (id, big) => { const n = prof(id) ? nameOf(id) : '?'; return `<span class="av${big?' lg':''}" style="--h:${hue(id)}" title="${esc(n)}">${esc(ini(n))}</span>`; };
const firstName = () => (S.me.full_name || S.me.email).split(/[\s@]/)[0];

/* ---------- arranque y sesión ---------- */
function init() {
  if (!window.supabase || /TU-PROYECTO|TU_ANON_KEY/.test(CONFIG.SUPABASE_URL + CONFIG.SUPABASE_ANON_KEY)) { renderSetup(); return; }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY,
    {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  window.addEventListener('hashchange', route);
  // setTimeout: supabase-js no admite llamadas asíncronas dentro del propio callback
  sb.auth.onAuthStateChange((ev, session) => setTimeout(() => onAuth(ev, session), 0));
}

async function onAuth(ev, session) {
  if (ev === 'PASSWORD_RECOVERY') { recovering = true; renderRecovery(); return; }
  if (recovering || ev === 'TOKEN_REFRESHED') return;
  if (!session) { teardown(); S.user = null; S.me = null; renderLogin(); return; }
  if (S.user?.id === session.user.id && S.me) return;
  S.user = session.user;
  await enter();
}

async function enter() {
  if (entering) return;
  entering = true;
  try {
    $('#app').innerHTML = `<div class="center"><p class="sub">Cargando…</p></div>`;
    const {data: me, error} = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    if (error || !me) { renderFatal('No se pudo cargar tu perfil. ¿Has ejecutado supabase.sql en tu proyecto?' + (error ? ' (' + errMsg(error) + ')' : '')); return; }
    S.me = me;
    if (!me.active) { renderPending(); return; }
    if (!(await loadData())) return;
    renderShell();
    route();
    subscribe();
  } finally { entering = false; }
}

async function loadData() {
  const [me, p, pr, m, t] = await Promise.all([
    sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle(),
    sb.from('profiles').select('*').order('full_name'),
    sb.from('projects').select('*').order('created_at', {ascending: false}),
    sb.from('project_members').select('*'),
    sb.from('tasks').select('*').order('created_at', {ascending: false})
  ]);
  const bad = [me, p, pr, m, t].find(r => r.error);
  if (bad) { toast('Error cargando datos: ' + errMsg(bad.error), 'err'); return false; }
  if (me.data) S.me = me.data;
  if (!S.me.active) { teardown(); renderPending(); return false; }
  S.profiles = p.data; S.projects = pr.data; S.members = m.data; S.tasks = t.data;
  return true;
}
async function refresh() { if (await loadData()) render(); }

let rt;
function subscribe() {
  if (channel) return;
  channel = sb.channel('panel')
    .on('postgres_changes', {event: '*', schema: 'public'}, () => { clearTimeout(rt); rt = setTimeout(refresh, 500); })
    .subscribe();
}
function teardown() { if (channel) { sb.removeChannel(channel); channel = null; } clearTimeout(rt); }

/* ---------- pantallas de acceso ---------- */
function renderSetup() {
  $('#app').innerHTML = `<div class="center"><div class="auth setup">
  <img class="lg" src="${LOGO}" alt="Sintaxis Studio">
  <h1>Falta conectar Supabase</h1><p class="sub">${window.supabase ? 'Todavía no has configurado el proyecto.' : 'No se pudo cargar la librería de Supabase (revisa tu conexión).'}</p>
  <ol><li>Crea un proyecto en <b>supabase.com</b> y ejecuta <code>supabase.sql</code> en el SQL Editor.</li>
  <li>Copia la <b>Project URL</b> y la <b>anon key</b> (Project Settings &gt; API).</li>
  <li>Pégalas en el bloque <code>CONFIG</code> al principio del script de este archivo.</li></ol></div></div>`;
}
function renderFatal(msg) {
  $('#app').innerHTML = `<div class="center"><div class="auth"><img class="lg" src="${LOGO}" alt="Sintaxis Studio"><h1>Algo ha fallado</h1><p class="sub">${esc(msg)}</p><button class="btn o" data-act="logout">Cerrar sesión</button></div></div>`;
}
function renderPending() {
  $('#app').innerHTML = `<div class="center"><div class="auth"><img class="lg" src="${LOGO}" alt="Sintaxis Studio">
  <h1>Cuenta pendiente</h1><p class="sub">Hola, ${esc(firstName())}. Tu cuenta se ha creado correctamente, pero un administrador tiene que activarla antes de que puedas entrar al panel.</p>
  <div class="acts"><button class="btn" data-act="recheck">Comprobar de nuevo</button><button class="btn o" data-act="logout">Cerrar sesión</button></div></div></div>`;
}
function renderLogin(mode = 'in', note) {
  const up = mode === 'up';
  $('#app').innerHTML = `<div class="center"><div class="auth"><img class="lg" src="${LOGO}" alt="Sintaxis Studio">
  <h1>${up ? 'Crear cuenta' : 'Panel del equipo'}</h1><p class="sub">${up ? 'Un administrador tendrá que activar tu cuenta antes de que puedas entrar.' : 'Entra con tu cuenta para ver tus proyectos y tareas.'}</p>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${!up}" data-act="authTab" data-m="in">Entrar</button><button role="tab" aria-selected="${up}" data-act="authTab" data-m="up">Crear cuenta</button></div>
  <form id="authf" novalidate>
    ${up ? `<label>Nombre completo<input name="name" required autocomplete="name" maxlength="80"></label>` : ''}
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Contraseña<input name="password" type="password" required minlength="6" autocomplete="${up ? 'new-password' : 'current-password'}"></label>
    <div id="amsg" class="msg ${note ? 'ok' : 'hide'}" role="alert">${esc(note || '')}</div>
    <button class="btn" type="submit">${up ? 'Crear cuenta' : 'Entrar'}</button>
    ${up ? '' : '<button type="button" class="lnk" data-act="forgot">He olvidado mi contraseña</button>'}
  </form></div></div>`;
  $('#authf').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, fd = new FormData(f), btn = $('button[type=submit]', f), box = $('#amsg');
    const say = (t, ok) => { box.className = 'msg ' + (ok ? 'ok' : 'err'); box.textContent = t; };
    const email = fd.get('email').trim(), password = fd.get('password');
    if (!email || password.length < 6 || (up && !fd.get('name').trim())) return say('Rellena todos los campos (contraseña de 6+ caracteres).');
    btn.disabled = true;
    try {
      if (up) {
        const {data, error} = await sb.auth.signUp({email, password, options: {data: {full_name: fd.get('name').trim()}}});
        if (error) return say(errMsg(error));
        if (!data.session) say('Cuenta creada. Revisa tu email para confirmarla y luego entra.', true);
      } else {
        const {error} = await sb.auth.signInWithPassword({email, password});
        if (error) return say(errMsg(error));
      }
    } finally { btn.disabled = false; }
  };
}
function renderRecovery() {
  $('#app').innerHTML = `<div class="center"><div class="auth"><img class="lg" src="${LOGO}" alt="Sintaxis Studio">
  <h1>Nueva contraseña</h1><p class="sub">Elige una contraseña nueva para tu cuenta.</p>
  <form id="recf"><label>Nueva contraseña<input name="password" type="password" minlength="6" required autocomplete="new-password"></label>
  <div id="amsg" class="msg hide" role="alert"></div><button class="btn" type="submit">Guardar contraseña</button></form></div></div>`;
  $('#recf').onsubmit = async e => {
    e.preventDefault();
    const pw = new FormData(e.target).get('password'), box = $('#amsg');
    if (pw.length < 6) { box.className = 'msg err'; box.textContent = 'Mínimo 6 caracteres.'; return; }
    const {error} = await sb.auth.updateUser({password: pw});
    if (error) { box.className = 'msg err'; box.textContent = errMsg(error); return; }
    recovering = false;
    history.replaceState(null, '', location.pathname);
    const {data} = await sb.auth.getSession();
    if (data.session) { S.user = data.session.user; S.me = null; await enter(); } else renderLogin();
    toast('Contraseña actualizada.');
  };
}

/* ---------- estructura del panel ---------- */
function renderShell() {
  $('#app').innerHTML = `<div class="top"><img src="${LOGO}" alt="Sintaxis Studio"><button class="x" data-act="menu" aria-label="Abrir menú">☰</button></div>
  <div class="shell"><aside class="side"><img class="lg" src="${LOGO}" alt="Sintaxis Studio">
    <nav id="nav" aria-label="Principal"></nav>
    <div class="me"><button class="who" data-act="profile" id="who"></button><button class="btn o s" data-act="logout">Cerrar sesión</button></div>
  </aside><main id="main"></main></div>`;
}
function route() {
  if (!S.me?.active || !$('#main')) return;
  const [v, id] = location.hash.replace(/^#\//, '').split('/');
  S.view = ['resumen', 'proyectos', 'proyecto', 'tareas', 'equipo'].includes(v) ? v : 'resumen';
  S.projectId = id || null;
  document.body.classList.remove('mo');
  render();
  window.scrollTo(0, 0);
}
function render() {
  if (!S.me?.active || !$('#main')) return;
  const pending = isAdmin() ? S.profiles.filter(p => !p.active).length : 0;
  const cur = S.view === 'proyecto' ? 'proyectos' : S.view;
  const item = (v, label, extra = '') => `<a href="#/${v}"${cur === v ? ' aria-current="page"' : ''}>${label}${extra}</a>`;
  $('#nav').innerHTML = item('resumen', 'Resumen') + item('proyectos', 'Proyectos') + item('tareas', 'Mis tareas') +
    item('equipo', 'Equipo', pending ? `<span class="badge" title="Cuentas pendientes">${pending}</span>` : '');
  $('#who').innerHTML = `${avatar(S.me.id)}<span><b>${esc(S.me.full_name || S.me.email)}</b><small>${isAdmin() ? 'Administrador' : 'Trabajador'}</small></span>`;
  const views = {resumen: viewResumen, proyectos: viewProyectos, proyecto: viewProyecto, tareas: viewTareas, equipo: viewEquipo};
  $('#main').innerHTML = views[S.view]();
}

/* ---------- vistas ---------- */
const empty = t => `<p class="empty">${esc(t)}</p>`;

function taskRow(t) {
  const p = projOf(t.project_id);
  return `<div class="tr${t.status === 'hecha' ? ' done' : ''}" data-act="openTask" data-id="${t.id}">
    <input type="checkbox" data-act="toggleTask" data-id="${t.id}" ${t.status === 'hecha' ? 'checked' : ''} aria-label="Marcar como hecha">
    <div class="tt"><b>${esc(t.title)}</b><small>${esc(p?.name || '')}</small></div>
    <div class="meta"><span class="pr ${t.priority}" title="Prioridad ${PRIO[t.priority]}"></span>
    ${t.due_date ? `<span class="due${isOverdue(t) ? ' late' : ''}">${fmtDate(t.due_date)}</span>` : ''}
    ${t.assignee ? avatar(t.assignee) : ''}</div></div>`;
}
function progress(pid) {
  const ts = tasksOf(pid), done = ts.filter(t => t.status === 'hecha').length;
  return {done, total: ts.length, pct: ts.length ? Math.round(done / ts.length * 100) : 0};
}
function projectCard(p) {
  const pg = progress(p.id), ms = membersOf(p.id);
  return `<a class="pc" href="#/proyecto/${p.id}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3>${esc(p.name)}</h3><span class="chip st-${p.status}">${PSTATUS[p.status]}</span></div>
    ${p.client ? `<span class="sub" style="font-size:14px">${esc(p.client)}</span>` : ''}
    ${p.description ? `<p>${esc(p.description)}</p>` : ''}
    <div><div class="pb"><span>${pg.done}/${pg.total} tareas</span><span>${pg.pct}%</span></div><div class="bar"><i style="width:${pg.pct}%"></i></div></div>
    <div class="foot"><div class="avs">${ms.slice(0, 5).map(id => avatar(id)).join('')}</div>${p.due_date ? `<span class="due">Entrega ${fmtDate(p.due_date)}</span>` : ''}</div></a>`;
}

function viewResumen() {
  const open = S.tasks.filter(t => t.status !== 'hecha');
  const mine = open.filter(t => t.assignee === S.user.id);
  const late = mine.filter(isOverdue);
  const act = S.projects.filter(p => p.status === 'en_curso');
  const next = [...mine].sort(byDue).slice(0, 8);
  const stat = (n, l, c = '') => `<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`;
  return `<div class="ph"><div><h1>Hola, ${esc(firstName())}</h1><p class="sub">Esto es lo que tienes entre manos.</p></div>
    <button class="btn" data-act="newProject">Nuevo proyecto</button></div>
  <div class="stats">${stat(act.length, 'Proyectos en curso')}${stat(mine.length, 'Mis tareas abiertas')}${stat(late.length, 'Mis tareas vencidas', late.length ? 'bad' : '')}${stat(open.length, 'Tareas abiertas')}</div>
  <div class="two"><section class="box"><h2>Mis próximas tareas</h2>${next.length ? next.map(taskRow).join('') : empty('No tienes tareas pendientes.')}</section>
  <section class="box"><h2>Proyectos en curso</h2>${act.length ? act.slice(0, 5).map(p => { const g = progress(p.id); return `<a class="tr" href="#/proyecto/${p.id}"><div class="tt"><b>${esc(p.name)}</b><small>${esc(p.client || '—')} · ${g.pct}%</small></div>${p.due_date ? `<span class="due">${fmtDate(p.due_date)}</span>` : ''}</a>`; }).join('') : empty('No hay proyectos en curso.')}</section></div>`;
}

function viewProyectos() {
  const list = S.projects.filter(p => !S.fStatus || p.status === S.fStatus);
  return `<div class="ph"><div><h1>Proyectos</h1><p class="sub">${S.projects.length} en total${isAdmin() ? '' : ' (solo ves en los que participas)'}</p></div>
    <div class="filters"><select data-chg="fStatus" aria-label="Filtrar por estado"><option value="">Todos los estados</option>${opts(PSTATUS, S.fStatus)}</select>
    <button class="btn" data-act="newProject">Nuevo proyecto</button></div></div>
  ${list.length ? `<div class="grid">${list.map(projectCard).join('')}</div>` : empty(S.projects.length ? 'Ningún proyecto con ese estado.' : 'Aún no hay proyectos. Crea el primero con «Nuevo proyecto».')}`;
}

function sortTasks(ts) { const w = {alta: 0, media: 1, baja: 2}; return [...ts].sort((a, b) => w[a.priority] - w[b.priority] || byDue(a, b)); }

function viewProyecto() {
  const p = projOf(S.projectId);
  if (!p) return `<a class="back" href="#/proyectos">← Proyectos</a>${empty('Este proyecto no existe o no tienes acceso.')}`;
  const pg = progress(p.id), manage = canManageProject(p);
  const ts = tasksOf(p.id).filter(t => !S.onlyMine || t.assignee === S.user.id);
  const cols = Object.keys(TSTATUS).map(k => {
    const c = sortTasks(ts.filter(t => t.status === k));
    return `<div class="col" data-status="${k}"><h3>${TSTATUS[k]} <span>${c.length}</span></h3><div class="cl">${c.map(t => `<div class="tk" draggable="true" data-act="openTask" data-id="${t.id}">
      <div class="tt">${esc(t.title)}</div><div class="tm"><span class="pr ${t.priority}" title="Prioridad ${PRIO[t.priority]}"></span>
      ${t.due_date ? `<span class="due${isOverdue(t) ? ' late' : ''}">${fmtDate(t.due_date)}</span>` : ''}${t.assignee ? avatar(t.assignee) : ''}</div></div>`).join('')}</div></div>`;
  }).join('');
  return `<a class="back" href="#/proyectos">← Proyectos</a>
  <div class="ph"><div style="min-width:0"><h1>${esc(p.name)}</h1>
    <div class="pd"><span class="chip st-${p.status}">${PSTATUS[p.status]}</span>${p.client ? `<span class="chip">${esc(p.client)}</span>` : ''}${p.due_date ? `<span class="chip">Entrega ${fmtDate(p.due_date)}</span>` : ''}
    <button class="lnk" data-act="members" data-id="${p.id}"><span class="avs" style="display:inline-flex;vertical-align:middle;margin-right:8px">${membersOf(p.id).slice(0, 4).map(id => avatar(id)).join('')}</span>${membersOf(p.id).length} miembros</button></div>
    ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}</div>
    <div class="acts">${manage ? `<button class="btn o s" data-act="editProject" data-id="${p.id}">Editar</button><button class="btn d s" data-act="delProject" data-id="${p.id}">Eliminar</button>` : ''}
    <button class="btn" data-act="newTask" data-project="${p.id}">Nueva tarea</button></div></div>
  <div style="max-width:420px;margin-bottom:26px"><div class="pb"><span>${pg.done} de ${pg.total} tareas hechas</span><span>${pg.pct}%</span></div><div class="bar"><i style="width:${pg.pct}%"></i></div></div>
  <div class="filters" style="margin-bottom:18px"><label class="ck"><input type="checkbox" data-chg="onlyMine" ${S.onlyMine ? 'checked' : ''}> Solo mis tareas</label></div>
  <div class="kb">${cols}</div>`;
}

function viewTareas() {
  let ts = S.tasks.filter(t => t.assignee === S.user.id);
  if (S.tFilter === 'abiertas') ts = ts.filter(t => t.status !== 'hecha');
  if (S.tFilter === 'hechas') ts = ts.filter(t => t.status === 'hecha');
  ts.sort(byDue);
  return `<div class="ph"><div><h1>Mis tareas</h1><p class="sub">Las tareas que tienes asignadas.</p></div>
    <div class="filters"><select data-chg="tFilter" aria-label="Filtro"><option value="abiertas"${S.tFilter === 'abiertas' ? ' selected' : ''}>Abiertas</option><option value="hechas"${S.tFilter === 'hechas' ? ' selected' : ''}>Hechas</option><option value="todas"${S.tFilter === 'todas' ? ' selected' : ''}>Todas</option></select>
    <button class="btn" data-act="newTask">Nueva tarea</button></div></div>
  <section class="box">${ts.length ? ts.map(taskRow).join('') : empty('No hay tareas en esta vista.')}</section>`;
}

function viewEquipo() {
  const list = [...S.profiles].sort((a, b) => a.active - b.active || (a.full_name || a.email).localeCompare(b.full_name || b.email));
  return `<div class="ph"><div><h1>Equipo</h1><p class="sub">${isAdmin() ? 'Activa cuentas nuevas y gestiona los roles.' : 'Las personas que forman Sintaxis Studio.'}</p></div></div>
  <div class="tbl"><table><thead><tr><th>Persona</th><th>Rol</th><th>Estado</th>${isAdmin() ? '<th></th>' : ''}</tr></thead><tbody>
  ${list.map(p => { const self = p.id === S.user.id; return `<tr><td><div class="pn">${avatar(p.id, true)}<div><b style="font-weight:500">${esc(p.full_name || '—')}${self ? ' (tú)' : ''}</b><small>${esc(p.email)}</small></div></div></td>
    <td>${isAdmin() && !self ? `<select data-chg="role" data-id="${p.id}" aria-label="Rol de ${esc(p.full_name || p.email)}"><option value="member"${p.role === 'member' ? ' selected' : ''}>Trabajador</option><option value="admin"${p.role === 'admin' ? ' selected' : ''}>Administrador</option></select>` : (p.role === 'admin' ? 'Administrador' : 'Trabajador')}</td>
    <td><span class="chip ${p.active ? 'st-completado' : 'st-en_pausa'}">${p.active ? 'Activa' : 'Pendiente'}</span></td>
    ${isAdmin() ? `<td style="text-align:right">${self ? '' : `<button class="btn ${p.active ? 'o' : ''} s" data-act="toggleUser" data-id="${p.id}">${p.active ? 'Desactivar' : 'Activar'}</button>`}</td>` : ''}</tr>`; }).join('')}
  </tbody></table></div>`;
}

/* ---------- diálogos ---------- */
const dlg = () => $('#dlg');
function modal(title, body, o = {}) {
  const d = dlg();
  d.innerHTML = `<form class="mf" novalidate><div class="dh"><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Cerrar">✕</button></div>
    <div class="db">${body}</div>
    <div class="df">${o.extra || ''}<button type="button" class="btn o" data-close>${o.onSubmit ? 'Cancelar' : 'Cerrar'}</button>${o.onSubmit ? `<button class="btn${o.danger ? ' d' : ''}" type="submit">${esc(o.submit || 'Guardar')}</button>` : ''}</div></form>`;
  const form = $('form', d);
  form.onsubmit = async e => {
    e.preventDefault();
    if (!o.onSubmit) return;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const btn = $('button[type=submit]', form); btn.disabled = true;
    try { if ((await o.onSubmit(new FormData(form), form)) !== false) d.close(); }
    catch (err) { toast(errMsg(err), 'err'); }
    finally { btn.disabled = false; }
  };
  if (!d.open) d.showModal();
  const f = $('input:not([type=hidden]),textarea,select', form); if (f && o.focus !== false) f.focus();
}
const closeDlg = () => { if (dlg().open) dlg().close(); };
function confirmModal(title, text, label, onYes) {
  modal(title, `<p>${esc(text)}</p>`, {submit: label, danger: true, onSubmit: async () => { await onYes(); }, focus: false});
}
async function run(q, okMsg) {
  const {data, error} = await q;
  if (error) { toast(errMsg(error), 'err'); return null; }
  if (okMsg) toast(okMsg);
  return data ?? true;
}

function projectModal(p) {
  const ed = !!p;
  modal(ed ? 'Editar proyecto' : 'Nuevo proyecto', `
    <label>Nombre<input name="name" required maxlength="120" value="${esc(p?.name)}"></label>
    <div class="row2"><label>Cliente<input name="client" maxlength="120" value="${esc(p?.client)}"></label>
    <label>Fecha de entrega<input type="date" name="due_date" value="${esc(p?.due_date || '')}"></label></div>
    <label>Estado<select name="status">${opts(PSTATUS, p?.status || 'planificado')}</select></label>
    <label>Descripción<textarea name="description">${esc(p?.description)}</textarea></label>`, {
    submit: ed ? 'Guardar' : 'Crear proyecto',
    onSubmit: async fd => {
      const row = {name: fd.get('name').trim(), client: fd.get('client').trim(), status: fd.get('status'), due_date: fd.get('due_date') || null, description: fd.get('description').trim()};
      if (!row.name) { toast('Ponle un nombre al proyecto.', 'err'); return false; }
      if (ed) {
        if (!(await run(sb.from('projects').update(row).eq('id', p.id), 'Proyecto guardado.'))) return false;
        await refresh();
      } else {
        const r = await run(sb.from('projects').insert(row).select().single(), 'Proyecto creado.');
        if (!r) return false;
        await refresh();
        location.hash = '#/proyecto/' + r.id;
      }
    }
  });
}

function assigneeOpts(pid, sel) {
  const ids = new Set(membersOf(pid)); if (sel) ids.add(sel);
  return `<option value="">Sin asignar</option>` + [...ids].filter(id => prof(id)).map(id => `<option value="${id}"${id === sel ? ' selected' : ''}>${esc(nameOf(id))}</option>`).join('');
}

function taskModal(t, pid) {
  const ed = !!t; pid = t ? t.project_id : pid;
  if (!S.projects.length) { toast('Crea primero un proyecto.', 'err'); return; }
  if (!pid || !projOf(pid)) pid = (S.view === 'proyecto' && projOf(S.projectId)) ? S.projectId : S.projects[0].id;
  const sel = t ? t.assignee : (membersOf(pid).includes(S.user.id) ? S.user.id : '');
  const extra = ed && canDeleteTask(t) ? `<button type="button" class="btn d sp" data-act="delTask" data-id="${t.id}">Eliminar</button>` : '';
  modal(ed ? 'Tarea' : 'Nueva tarea', `
    <label>Título<input name="title" required maxlength="200" value="${esc(t?.title)}"></label>
    <label>Descripción<textarea name="description">${esc(t?.description)}</textarea></label>
    <div class="row2"><label>Proyecto<select name="project_id" ${ed ? 'disabled' : ''}>${S.projects.map(p => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label>Asignada a<select name="assignee">${assigneeOpts(pid, sel)}</select></label></div>
    <div class="row2"><label>Estado<select name="status">${opts(TSTATUS, t?.status || 'pendiente')}</select></label>
    <label>Prioridad<select name="priority">${opts(PRIO, t?.priority || 'media')}</select></label></div>
    <label>Fecha límite<input type="date" name="due_date" value="${esc(t?.due_date || '')}"></label>
    ${ed ? `<div class="cm"><h3>Comentarios</h3><div id="cml" class="empty" style="padding:0">Cargando…</div>
      <div class="cmn"><input id="cmi" placeholder="Escribe un comentario…" maxlength="2000" aria-label="Nuevo comentario"><button type="button" class="btn s" data-act="addComment" data-id="${t.id}">Enviar</button></div></div>` : ''}`, {
    submit: ed ? 'Guardar' : 'Crear tarea', extra, focus: !ed,
    onSubmit: async fd => {
      const row = {title: fd.get('title').trim(), description: fd.get('description').trim(), status: fd.get('status'), priority: fd.get('priority'), assignee: fd.get('assignee') || null, due_date: fd.get('due_date') || null};
      if (!row.title) { toast('Ponle un título a la tarea.', 'err'); return false; }
      const q = ed ? sb.from('tasks').update(row).eq('id', t.id) : sb.from('tasks').insert({...row, project_id: fd.get('project_id')});
      if (!(await run(q, ed ? 'Tarea guardada.' : 'Tarea creada.'))) return false;
      await refresh();
    }
  });
  const ps = $('[name=project_id]', dlg());
  if (!ed) ps.onchange = () => { $('[name=assignee]', dlg()).innerHTML = assigneeOpts(ps.value, ''); };
  if (ed) {
    const inp = $('#cmi'); inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ACT.addComment({dataset: {id: t.id}}); } };
    loadComments(t.id);
  }
}

async function loadComments(tid) {
  const {data, error} = await sb.from('comments').select('*').eq('task_id', tid).order('created_at');
  const box = $('#cml'); if (!box) return;
  if (error) { box.textContent = 'No se pudieron cargar los comentarios.'; return; }
  box.className = ''; box.style.cssText = 'display:grid;gap:10px';
  box.innerHTML = data.length ? data.map(c => `<div class="cmi"><header>${avatar(c.author)}<b>${esc(nameOf(c.author))}</b><span>${fmtTime(c.created_at)}</span>
    ${c.author === S.user.id || isAdmin() ? `<button type="button" class="x" data-act="delComment" data-id="${c.id}" data-task="${tid}" aria-label="Borrar comentario">✕</button>` : ''}</header><p>${esc(c.body)}</p></div>`).join('') : '<p class="sub" style="font-size:14px">Aún no hay comentarios.</p>';
}

function membersModal(pid) {
  const p = projOf(pid); if (!p) return;
  const manage = canManageProject(p), ids = membersOf(pid), avail = S.profiles.filter(x => x.active && !ids.includes(x.id));
  modal('Miembros · ' + p.name, `<ul class="ml">${ids.map(id => `<li>${avatar(id)}<span>${esc(nameOf(id))}</span>${manage && id !== p.created_by ? `<button type="button" class="x" data-act="rmMember" data-p="${pid}" data-u="${id}" aria-label="Quitar a ${esc(nameOf(id))}">✕</button>` : ''}</li>`).join('') || '<li><span>Sin miembros</span></li>'}</ul>
    ${manage ? (avail.length ? `<div class="addm"><select id="addsel" aria-label="Añadir miembro">${avail.map(x => `<option value="${x.id}">${esc(x.full_name || x.email)}</option>`).join('')}</select><button type="button" class="btn s" data-act="addMember" data-p="${pid}">Añadir</button></div>` : '<p class="sub">Todas las personas activas del equipo ya están en el proyecto.</p>') : '<p class="sub">Solo el creador del proyecto o un administrador puede cambiar los miembros.</p>'}`, {focus: false});
}

function profileModal() {
  modal('Mi perfil', `<label>Nombre completo<input name="name" required maxlength="80" value="${esc(S.me.full_name)}"></label>
    <label>Email<input value="${esc(S.me.email)}" disabled></label>
    <label>Nueva contraseña (opcional)<input name="password" type="password" minlength="6" autocomplete="new-password" placeholder="Déjalo vacío para no cambiarla"></label>`, {
    onSubmit: async fd => {
      const name = fd.get('name').trim(), pw = fd.get('password');
      if (!name) { toast('El nombre no puede estar vacío.', 'err'); return false; }
      if (pw && pw.length < 6) { toast('La contraseña debe tener al menos 6 caracteres.', 'err'); return false; }
      if (!(await run(sb.from('profiles').update({full_name: name}).eq('id', S.user.id)))) return false;
      if (pw) { const {error} = await sb.auth.updateUser({password: pw}); if (error) { toast(errMsg(error), 'err'); return false; } }
      toast('Perfil actualizado.'); await refresh();
    }
  });
}

/* ---------- acciones ---------- */
const ACT = {
  menu() { document.body.classList.toggle('mo'); },
  async logout() { await sb.auth.signOut(); },
  async recheck() { S.me = null; await enter(); },
  authTab(el) { renderLogin(el.dataset.m); },
  async forgot() {
    const email = ($('#authf [name=email]')?.value || '').trim(), box = $('#amsg');
    if (!email) { box.className = 'msg err'; box.textContent = 'Escribe tu email arriba y vuelve a pulsar.'; return; }
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    box.className = 'msg ' + (error ? 'err' : 'ok'); box.textContent = error ? errMsg(error) : 'Si el email existe, te hemos enviado un enlace para cambiar la contraseña.';
  },
  profile: profileModal,
  newProject: () => projectModal(),
  editProject: el => projectModal(projOf(el.dataset.id)),
  delProject(el) {
    const p = projOf(el.dataset.id);
    confirmModal('Eliminar proyecto', `Se borrará «${p.name}» con todas sus tareas y comentarios. No se puede deshacer.`, 'Eliminar', async () => {
      if (!(await run(sb.from('projects').delete().eq('id', p.id), 'Proyecto eliminado.'))) return false;
      location.hash = '#/proyectos'; await refresh();
    });
  },
  members: el => membersModal(el.dataset.id),
  async addMember(el) {
    const uid = $('#addsel')?.value; if (!uid) return;
    if (await run(sb.from('project_members').insert({project_id: el.dataset.p, user_id: uid}))) { await refresh(); membersModal(el.dataset.p); }
  },
  async rmMember(el) {
    if (await run(sb.from('project_members').delete().eq('project_id', el.dataset.p).eq('user_id', el.dataset.u))) { await refresh(); membersModal(el.dataset.p); }
  },
  newTask: el => taskModal(null, el.dataset?.project),
  openTask: el => taskModal(S.tasks.find(t => t.id === el.dataset.id)),
  async toggleTask(el) {
    const t = S.tasks.find(x => x.id === el.dataset.id); if (!t) return;
    await moveTask(t.id, t.status === 'hecha' ? 'pendiente' : 'hecha');
  },
  delTask(el) {
    const t = S.tasks.find(x => x.id === el.dataset.id);
    confirmModal('Eliminar tarea', `Se borrará «${t.title}» y sus comentarios.`, 'Eliminar', async () => {
      if (!(await run(sb.from('tasks').delete().eq('id', t.id), 'Tarea eliminada.'))) return false;
      await refresh();
    });
  },
  async addComment(el) {
    const inp = $('#cmi'), body = inp.value.trim(); if (!body) return;
    if (await run(sb.from('comments').insert({task_id: el.dataset.id, body}))) { inp.value = ''; loadComments(el.dataset.id); }
  },
  async delComment(el) { if (await run(sb.from('comments').delete().eq('id', el.dataset.id))) loadComments(el.dataset.task); },
  async toggleUser(el) {
    const p = prof(el.dataset.id); if (!p) return;
    if (await run(sb.from('profiles').update({active: !p.active}).eq('id', p.id), p.active ? 'Cuenta desactivada.' : 'Cuenta activada.')) await refresh();
  }
};
const CHG = {
  fStatus: el => { S.fStatus = el.value; render(); },
  tFilter: el => { S.tFilter = el.value; render(); },
  onlyMine: el => { S.onlyMine = el.checked; render(); },
  async role(el) {
    await run(sb.from('profiles').update({role: el.value}).eq('id', el.dataset.id), 'Rol actualizado.'); await refresh();
  }
};

async function moveTask(id, status) {
  const t = S.tasks.find(x => x.id === id); if (!t || t.status === status) return;
  const prev = t.status; t.status = status; render();               // optimista
  const {error} = await sb.from('tasks').update({status}).eq('id', id);
  if (error) { t.status = prev; render(); toast(errMsg(error), 'err'); }
}

/* ---------- eventos globales ---------- */
document.addEventListener('click', e => {
  if (e.target === dlg()) return closeDlg();
  if (e.target.closest('[data-close]')) return closeDlg();
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.tk'); if (!c) return; dragId = c.dataset.id; c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drag,.ov').forEach(x => x.classList.remove('drag', 'ov')); });
document.addEventListener('dragover', e => { const c = e.target.closest?.('.col'); if (!c || !dragId) return; e.preventDefault(); document.querySelectorAll('.col.ov').forEach(x => x !== c && x.classList.remove('ov')); c.classList.add('ov'); });
document.addEventListener('drop', e => { const c = e.target.closest?.('.col'); if (!c || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; document.querySelectorAll('.ov').forEach(x => x.classList.remove('ov')); moveTask(id, c.dataset.status); });

init();
</script>
</body>
</html>
